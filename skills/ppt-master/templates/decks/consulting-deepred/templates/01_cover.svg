  <line id="cover-footer-line" x1="540" y1="548" x2="740" y2="548" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1" data-pptx-layer="layout" data-pptx-editable="false"/>
  <g id="cover-title-slot" data-pptx-placeholder="title"
